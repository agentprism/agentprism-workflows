name: CI

# workflow_dispatch is for ad-hoc manual runs on any ref. The release flow does not
# depend on it: the Version Packages PR is authored with the release app token, so its
# pull_request run triggers natively and satisfies the main ruleset's required check.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-and-test:
    # Version-agnostic job name ON PURPOSE: the main ruleset's required status
    # check matches this string exactly — renaming it wedges every merge until
    # the ruleset context is updated to match.
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history so Changesets / git-aware tooling has the base ref.
          fetch-depth: 0

      # pnpm must be installed before setup-node so the `cache: pnpm` step
      # below can locate the pnpm store.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # ACP dependency freshness gate — a step of the REQUIRED check on purpose:
      # while any tracked ACP dependency (@agentclientprotocol/*, the codex-acp
      # fork vs its upstream, the wrapped claude-agent-sdk runtime, or
      # @earendil-works/pi-coding-agent) is stale, EVERY merge is blocked until
      # a PR lands that does the maintenance (owner policy, 2026-07-16 — no
      # bypasses). Fails closed if the registry cannot be reached or the fork
      # clone cannot be verified; with no fork clone on the runner the gate
      # clones the fork itself (public repos, no token). Needs no node_modules
      # (zero-dep script), so it runs before the install. Triage:
      # CONTRIBUTING.md "When the dependency gate blocks".
      - name: ACP dependency freshness gate
        run: node scripts/check-acp-deps.mjs

      # --frozen-lockfile restores the exact dependency tree (incl. the
      # @automatalabs/codex-acp fork, which bakes the outputSchema forward into
      # its dist) AND fetches the linux-x64 codex/claude native binaries. Keep
      # this on an ubuntu (glibc) x64 runner and do NOT pass --no-optional, or
      # those platform binaries would be skipped.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (project references)
        run: pnpm -r exec tsc -b

      - name: Typecheck (no emit)
        run: pnpm -r exec tsc --noEmit

      # AGENTPRISM_LIVE_E2E is intentionally left UNSET here so the gated live
      # end-to-end test is skipped — this keeps CI deterministic and
      # credential-free.
      - name: Test
        run: pnpm -r test
