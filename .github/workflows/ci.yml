name: CI

# workflow_dispatch exists for the release flow: the Version Packages PR is pushed with
# GITHUB_TOKEN, so no pull_request run triggers on it (the Actions recursion guard).
# release.yml dispatches this workflow onto the changeset branch instead — the check runs
# attach to the head SHA and satisfy the main ruleset's required "Build & test" check.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-and-test:
    name: Build & test (Node 22, ubuntu x64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so Changesets / git-aware tooling has the base ref.
          fetch-depth: 0

      # pnpm must be installed before setup-node so the `cache: pnpm` step
      # below can locate the pnpm store.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # --frozen-lockfile restores the exact dependency tree (incl. the
      # @automatalabs/codex-acp fork, which bakes the outputSchema forward into
      # its dist) AND fetches the linux-x64 codex/claude native binaries. Keep
      # this on an ubuntu (glibc) x64 runner and do NOT pass --no-optional, or
      # those platform binaries would be skipped.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (project references)
        run: pnpm -r exec tsc -b

      - name: Typecheck (no emit)
        run: pnpm -r exec tsc --noEmit

      # AGENTPRISM_LIVE_E2E is intentionally left UNSET here so the gated live
      # end-to-end test is skipped — this keeps CI deterministic and
      # credential-free.
      - name: Test
        run: pnpm -r test
