name: GitHub Pages data

on:
  schedule:
    # The generator uses an explicit 30-day UTC window ending two full days ago,
    # after npm's daily aggregation should have settled.
    - cron: "17 6 * * *"
    # Second attempt: structural or final-day completeness failures publish
    # nothing, so retry later the same day without weakening those guards.
    - cron: "23 18 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - .github/workflows/npm-download-badge.yml
      - scripts/generate-acp-registry.mjs
      - scripts/generate-npm-download-badge.mjs
      - docs/assets/agentprism-mark.svg
      - packages/*/package.json
  # A Version Packages merge bumps packages/*/package.json while release.yml is
  # still publishing, so its push run is skipped below (the generator would only
  # refuse the not-yet-published versions). This post-release run is the real
  # refresh: it fires once release.yml has completed successfully and waits,
  # bounded, for npm's `latest` records to catch up with the checked-in versions.
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: npm-download-badge-pages
  cancel-in-progress: false

jobs:
  build:
    name: Generate site data
    # Run for schedule, workflow_dispatch, and pushes that are not the
    # "Version Packages (#NNN)" squash merge: at that push npm has not yet
    # published the bumped versions, so the run would only refuse. The
    # post-release workflow_run below covers that refresh, and it runs only when
    # release.yml succeeded. `head_commit` exists only on push events; the other
    # events never evaluate that operand.
    if: >-
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
      && (github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Version Packages'))
    runs-on: ubuntu-latest
    # Fits the bounded post-release wait below plus the generators themselves.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Generate aggregate download data
        run: node scripts/generate-npm-download-badge.mjs --output-dir "$RUNNER_TEMP/agentprism-site"

      # Scheduled, manual, and non-release push runs expect npm to be current
      # already and refuse any mismatch immediately.
      - name: Generate ACP registry
        if: github.event_name != 'workflow_run'
        run: node scripts/generate-acp-registry.mjs --output-dir "$RUNNER_TEMP/agentprism-site"

      # npm's read path has served the previous `latest` for minutes after
      # "packages published successfully"; give it up to 15 minutes to catch up
      # before the same exact-version refusal applies.
      - name: Generate ACP registry (wait for npm to serve the release)
        if: github.event_name == 'workflow_run'
        run: node scripts/generate-acp-registry.mjs --output-dir "$RUNNER_TEMP/agentprism-site" --wait-for-publish 900

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/agentprism-site

  deploy:
    name: Deploy site data
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5
