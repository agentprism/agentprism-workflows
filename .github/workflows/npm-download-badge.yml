name: npm download badge

on:
  schedule:
    # npm publishes the previous UTC day's counts shortly after midnight.
    - cron: "17 6 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - .github/workflows/npm-download-badge.yml
      - scripts/generate-npm-download-badge.mjs
      - packages/*/package.json

permissions:
  contents: read

concurrency:
  group: npm-download-badge-pages
  cancel-in-progress: false

jobs:
  build:
    name: Generate badge data
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Generate aggregate download data
        run: node scripts/generate-npm-download-badge.mjs --output-dir "$RUNNER_TEMP/npm-download-badge-site"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/npm-download-badge-site

  deploy:
    name: Deploy badge data
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5
