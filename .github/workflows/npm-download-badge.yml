name: GitHub Pages data

on:
  schedule:
    # The generator uses an explicit 30-day UTC window ending two full days ago,
    # after npm's daily aggregation should have settled.
    - cron: "17 6 * * *"
    # Second attempt: structural or final-day completeness failures publish
    # nothing, so retry later the same day without weakening those guards.
    - cron: "23 18 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - .github/workflows/npm-download-badge.yml
      - scripts/generate-acp-registry.mjs
      - scripts/generate-npm-download-badge.mjs
      - docs/assets/agentprism-mark.svg
      - packages/*/package.json
  # A Version Packages merge can race npm publication. The push run refuses
  # to advertise that not-yet-published version; this post-release run refreshes
  # the registry only after release.yml has completed successfully.
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: npm-download-badge-pages
  cancel-in-progress: false

jobs:
  build:
    name: Generate site data
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Generate aggregate download data
        run: node scripts/generate-npm-download-badge.mjs --output-dir "$RUNNER_TEMP/agentprism-site"

      - name: Generate ACP registry
        run: node scripts/generate-acp-registry.mjs --output-dir "$RUNNER_TEMP/agentprism-site"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/agentprism-site

  deploy:
    name: Deploy site data
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5
