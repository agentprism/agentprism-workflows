# Token-less publish via npm OIDC trusted publishing + Changesets — fully
# hands-off: merging a changeset-bearing PR to main IS the release.
#
# On push to main, changesets/action either opens/updates a "Version Packages"
# PR (while changesets are pending) or — once that PR is merged — publishes the
# bumped packages. Publishing uses OIDC (id-token + NPM_CONFIG_PROVENANCE, no
# npm token), which requires a trusted publisher configured on npmjs.com for
# each @automatalabs package pointing at this repo + this workflow file
# (.github/workflows/release.yml). With no pending changesets and all versions
# already on the registry, the run is a safe no-op.
#
# The Version PR rides a GITHUB APP TOKEN (RELEASE_APP_CLIENT_ID +
# RELEASE_APP_PRIVATE_KEY secrets), the changesets-documented pattern for
# repos whose main requires status checks: only same-repo GITHUB_TOKEN events
# are recursion-guarded, so an app-pushed version branch triggers pull_request
# CI natively, the queued auto-merge lands the PR the moment the required
# check passes, and the app's merge push triggers this workflow's publish leg
# — event-driven end to end, no dispatching or polling. When the app secrets
# are absent the flow degrades gracefully: the Version PR is still created
# (GITHUB_TOKEN) and a human merge both satisfies the ruleset and triggers the
# publish leg.

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Fallback-path Changesets release PR (contents + pull-requests), npm
# provenance via OIDC trusted publishing (id-token), and the dependency-gate
# blocked-release report (issues). The app-token path carries its own
# permissions.
permissions:
  contents: write
  pull-requests: write
  id-token: write
  issues: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Version / publish (@automatalabs)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Secrets are not readable inside step `if:` expressions — surface presence via env.
    env:
      RELEASE_APP_CLIENT_ID: ${{ secrets.RELEASE_APP_CLIENT_ID }}
    steps:
      - name: Mint the release app token
        id: app-token
        if: env.RELEASE_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          # registry-url writes the .npmrc the publish step reads; required for
          # provenance / OIDC trusted publishing to target the public registry.
          registry-url: https://registry.npmjs.org

      # npm OIDC trusted publishing needs the npm CLI >= 11.5.1 for the token
      # exchange — Node 24's BUNDLED npm satisfies that natively. Do NOT re-add an
      # `npm install -g npm@latest` step here: overwriting the toolcache npm left a
      # hybrid install missing its `sigstore` module, failing every provenance
      # publish with MODULE_NOT_FOUND (runs 28982178371 / 28982372216). The
      # codex-acp fork publishes with the stock bundled npm — same here.

      # ACP dependency freshness gate — runs BEFORE any version/publish work and
      # fails closed. This closes the last staleness window: a tracked dependency
      # (@agentclientprotocol/*, the codex-acp fork vs upstream, the wrapped
      # claude-agent-sdk runtime, @earendil-works/pi-coding-agent) can go stale
      # BETWEEN a Version PR's green check and its merge triggering this publish
      # leg. When the gate fails, nothing is versioned or published, any open
      # Version PR is left open, and the report step below files/updates a
      # "Release blocked" issue so triage starts immediately (owner policy,
      # 2026-07-16 — no bypasses).
      - name: ACP dependency freshness gate
        id: dep-gate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          node scripts/check-acp-deps.mjs 2>&1 | tee /tmp/dep-gate-output.txt

      - name: Report the blocked release
        if: failure() && steps.dep-gate.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="Release blocked: ACP dependency gate failed"
          gate_output="$(cat /tmp/dep-gate-output.txt 2>/dev/null || echo 'gate output unavailable')"
          body="$(printf 'release.yml refused to version/publish at %s because the ACP dependency gate failed.\n\n```\n%s\n```\n\nTriage runbook: CONTRIBUTING.md section "When the dependency gate blocks" — identify what is stale, read the upstream changes, decide whether the bump is mechanical or needs agentprism adaptation work, land that PR (it unblocks every gate at once), and the next push to main releases normally.\n' "$GITHUB_SHA" "$gate_output")"
          existing="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty' || true)"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
          vp="$(gh pr list --state open --search "Version Packages in:title" --json number --jq '.[0].number // empty' || true)"
          if [ -n "$vp" ]; then
            gh pr comment "$vp" --body "The release run for $GITHUB_SHA was blocked by the ACP dependency gate — this PR stays open until the staleness is fixed on main. See the open \"$title\" issue for the gate output and triage runbook."
          fi

      # Same frozen install as CI: restores the exact dependency tree (incl. the
      # @automatalabs/codex-acp fork) and fetches the linux-x64 native binaries
      # (ubuntu glibc x64, no --no-optional).
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (project references)
        run: pnpm -r exec tsc -b

      # changesets/action opens/updates a "Version Packages" PR (running the
      # root `version` script = `changeset version`); when that PR is merged it
      # runs `publish` = the root `release` script (`pnpm build && changeset
      # publish`). With pnpm, `changeset publish` invokes `pnpm publish` per
      # changed package with `--no-git-checks` and `--access public` (from
      # .changeset/config.json access:public + each package's publishConfig);
      # NPM_CONFIG_PROVENANCE=true + the id-token permission emit npm provenance
      # via OIDC trusted publishing.
      - name: Create release PR / publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm run version
          publish: pnpm release
        env:
          # App token when configured (version branch/PR trigger CI natively);
          # GITHUB_TOKEN fallback still creates the PR, for a human to merge.
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
          # OIDC trusted publishing needs no NPM token. If you instead publish
          # with a classic automation token, expose it here as:
          #   NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # The Version PR is mechanical (bumps + changelogs derived from
      # already-reviewed changesets): queue auto-merge and exit. GitHub merges
      # it the moment the ruleset's required check passes; the app-authored
      # merge push re-triggers this workflow, which then runs the publish leg.
      - name: Queue auto-merge on the Version PR
        if: steps.changesets.outputs.pullRequestNumber && steps.app-token.outputs.token
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh pr merge "${{ steps.changesets.outputs.pullRequestNumber }}" --auto --squash

      - name: Note the manual-merge fallback
        if: steps.changesets.outputs.pullRequestNumber && !steps.app-token.outputs.token
        run: |
          echo "::warning::Version PR #${{ steps.changesets.outputs.pullRequestNumber }} awaits a manual merge — release app secrets (RELEASE_APP_CLIENT_ID / RELEASE_APP_PRIVATE_KEY) are not configured. A user-performed merge satisfies the CI gate (rerun the pending pull_request run if needed) and triggers the publish leg."
