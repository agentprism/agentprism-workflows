# Token-less release via npm OIDC trusted publishing + Changesets — fully
# hands-off: merging a changeset-bearing PR to main IS the release.
#
# On push to main, changesets/action either opens/updates a "Version Packages"
# PR (while changesets are pending) or — once that PR is merged — publishes the
# bumped packages. The Version PR is mechanical (bumps + changelogs derived
# from already-reviewed changesets), so the final step below merges it
# immediately and chain-dispatches this workflow to run the publish leg; no
# human touches anything after the feature PR merges. Publishing uses OIDC
# (id-token + NPM_CONFIG_PROVENANCE, no npm token), which requires a trusted
# publisher configured on npmjs.com for each @automatalabs package pointing at
# this repo + this workflow file (.github/workflows/release.yml). With no
# pending changesets and all versions already on the registry, the run is a
# safe no-op. workflow_dispatch is kept for manual runs (and is how the
# auto-merge step re-enters: a merge performed with GITHUB_TOKEN does not
# trigger push workflows — the Actions recursion guard — but workflow_dispatch
# is the documented exception).

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Required for the Changesets release PR (contents + pull-requests), for npm
# provenance via OIDC trusted publishing (id-token), and for the auto-merge
# step's chain-dispatch of this workflow (actions).
permissions:
  contents: write
  pull-requests: write
  id-token: write
  actions: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Version / publish (@automatalabs)
    runs-on: ubuntu-latest
    # Bounds the CI-gate wait on the Version PR — a failed dispatch must fail
    # the run visibly, not idle for the 6h default.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          # registry-url writes the .npmrc the publish step reads; required for
          # provenance / OIDC trusted publishing to target the public registry.
          registry-url: https://registry.npmjs.org

      # npm OIDC trusted publishing needs the npm CLI >= 11.5.1 for the token
      # exchange — Node 24's BUNDLED npm satisfies that natively. Do NOT re-add an
      # `npm install -g npm@latest` step here: overwriting the toolcache npm left a
      # hybrid install missing its `sigstore` module, failing every provenance
      # publish with MODULE_NOT_FOUND (runs 28982178371 / 28982372216). The
      # codex-acp fork publishes with the stock bundled npm — same here.

      # Same frozen install as CI: restores the exact dependency tree (incl. the
      # @automatalabs/codex-acp fork) and fetches the linux-x64 native binaries
      # (ubuntu glibc x64, no --no-optional).
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (project references)
        run: pnpm -r exec tsc -b

      # changesets/action opens/updates a "Version Packages" PR (running the
      # root `version` script = `changeset version`); when that PR is merged it
      # runs `publish` = the root `release` script (`pnpm build && changeset
      # publish`). With pnpm, `changeset publish` invokes `pnpm publish` per
      # changed package with `--no-git-checks` and `--access public` (from
      # .changeset/config.json access:public + each package's publishConfig);
      # NPM_CONFIG_PROVENANCE=true + the id-token permission emit npm provenance
      # via OIDC trusted publishing.
      - name: Create release PR / publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm run version
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
          # OIDC trusted publishing needs no NPM token. If you instead publish
          # with a classic automation token, expose it here as:
          #   NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Merge-to-main = release. The Version PR only contains the mechanical
      # output of already-merged changesets, but main's ruleset requires the
      # "Build & test" check on every merge — and a PR pushed with GITHUB_TOKEN
      # gets no pull_request CI run (the Actions recursion guard). So dispatch
      # CI onto the changeset branch (its check runs attach to the head SHA and
      # satisfy the ruleset), wait for green, then merge and chain-dispatch this
      # workflow: the merge itself (made with GITHUB_TOKEN) cannot trigger the
      # push event, so the dispatch is what runs the publish leg. On that
      # dispatched run no Version PR exists, this step is skipped, and the
      # chain terminates.
      - name: Gate the Version PR on CI, then merge and chain the publish
        if: steps.changesets.outputs.pullRequestNumber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR="${{ steps.changesets.outputs.pullRequestNumber }}"
          gh workflow run ci.yml --ref changeset-release/main
          # The dispatch is async and `gh pr checks` errors while zero check
          # runs exist — poll until the run registers, then watch it to green.
          until [ -n "$(gh pr checks "$PR" 2>/dev/null)" ]; do sleep 5; done
          gh pr checks "$PR" --watch --interval 20 --fail-fast
          gh pr merge "$PR" --squash
          gh workflow run release.yml --ref main
