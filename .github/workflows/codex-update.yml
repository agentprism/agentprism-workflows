# Ported from the codex-acp fork's daily updater (#282): tracks the @openai/codex app-server the
# packages/codex-acp adapter wraps. When npm publishes a newer codex, this bumps the dependency,
# regenerates the app-server types, lets Codex repair compatibility/tests via the
# codex-update-compat skill (skipped gracefully when OPENAI_API_KEY is not configured), adds a
# patch changeset, and opens an update PR. The PR rides the release app token when configured so
# CI runs on it natively; obsolete bot-only update PRs are closed when superseded.
name: Codex Update

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

env:
  CODEX_PACKAGE: "@openai/codex"
  CODEX_UPDATE_LABEL: "codex-update"
  PKG_DIR: packages/codex-acp
  GITHUB_BOT_USERNAME: "github-actions[bot]"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_update: ${{ steps.check.outputs.should_update }}
      version: ${{ steps.check.outputs.version }}
      branch: ${{ steps.check.outputs.branch }}
    steps:
      - uses: actions/checkout@v7

      - name: Check if update is required
        id: check
        run: |
          set -euo pipefail
          RAW=$(jq -r --arg pkg "$CODEX_PACKAGE" '.dependencies[$pkg]' "$PKG_DIR/package.json")
          CURRENT="${RAW#[\^~]}"
          LATEST=$(npm view "$CODEX_PACKAGE" version)
          if [ "$CURRENT" = "$LATEST" ]; then
            echo "Package is up to date ($CURRENT)"
            exit 0
          fi
          BRANCH="codex-update/$LATEST"
          if git ls-remote --exit-code --heads origin "refs/heads/$BRANCH" >/dev/null 2>&1; then
            echo "Branch $BRANCH already exists"
            exit 0
          fi
          echo "version=$LATEST" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "should_update=true" >> "$GITHUB_OUTPUT"

  update:
    needs: check
    if: needs.check.outputs.should_update == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    env:
      BRANCH: ${{ needs.check.outputs.branch }}
      VERSION: ${{ needs.check.outputs.version }}
      RELEASE_APP_CLIENT_ID: ${{ secrets.RELEASE_APP_CLIENT_ID }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Mint the release app token
        id: app-token
        if: env.RELEASE_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Configure git user and prepare branch
        run: |
          git config user.name "$GITHUB_BOT_USERNAME"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH" --

      - name: Install new version, regenerate types, changeset, commit
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm --filter @automatalabs/codex-acp add "$CODEX_PACKAGE@$VERSION"
          pnpm --filter @automatalabs/codex-acp run generate-types
          cat > ".changeset/codex-update-${VERSION//./-}.md" <<EOF
          ---
          "@automatalabs/codex-acp": patch
          ---

          Update \`@openai/codex\` to $VERSION and regenerate the app-server types.
          EOF
          git add "$PKG_DIR/package.json" pnpm-lock.yaml "$PKG_DIR/src/app-server" .changeset
          git commit -m "chore(codex-acp): update codex to $VERSION"

      - name: Finalize update with Codex
        id: codex-finalize
        if: env.OPENAI_API_KEY != ''
        uses: openai/codex-action@52fe01ec70a42f454c9d2ebd47598f9fd6893d56
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          codex-version: ${{ env.VERSION }}
          output-file: pr-body.md
          codex-args: >-
            --cd ${{ env.PKG_DIR }}
            -c sandbox_workspace_write.writable_roots=["${{ github.workspace }}/.git"]
          prompt: >
            Finalize the update using the codex-update-compat skill. The package lives at
            packages/codex-acp inside a pnpm monorepo; run its tests with
            `pnpm --filter @automatalabs/codex-acp test`.
            Commit only tracked file changes, and never create an empty commit.
            If there are changes, the commit message should mention that types or/and tests after
            the update were fixed.
            When creating the final message do not mention:
            * Validation run details.
            * Commits.
            * Hyperlinks.
            Mention only previously failed tests with failure reasons, also what you changed and why.

      - name: Push branch updates
        run: git push -- origin "$BRANCH"

      - name: Create PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
        run: |
          echo -e "[What's new](https://github.com/openai/codex/releases/tag/rust-v${VERSION})\n\n$(cat pr-body.md 2>/dev/null || true)" > pr-body.md
          gh pr create \
            --base main \
            --title "Update codex to $VERSION" \
            --body-file pr-body.md \
            --label "$CODEX_UPDATE_LABEL"

      - name: Close obsolete PRs
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          gh pr list \
            --state open \
            --label "$CODEX_UPDATE_LABEL" \
            --json number,headRefName \
            --jq '.[] | [.number, .headRefName] | @tsv' |
          while IFS=$'\t' read -r pr_number head_ref; do
            if [[ "$head_ref" == "$BRANCH" || "$head_ref" != codex-update/* ]]; then
              continue
            fi
            git fetch origin "$head_ref" --no-tags
            # If there are any non-bot commits, don't close the PR
            if git log --format='%cn' "origin/main..origin/${head_ref}" | grep -Fvxq "$GITHUB_BOT_USERNAME"; then
              continue
            fi
            gh pr close "$pr_number" \
              --delete-branch \
              --comment "Closing obsolete update PR"
          done
